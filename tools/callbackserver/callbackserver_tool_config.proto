syntax = "proto3";

package goonami.callbackserver;

option go_package = "github.com/google/goonami-scanner/tools/callbackserver/callbackserver_tool_config_go_proto";

option java_multiple_files = true;
option java_outer_classname = "CallbackserverToolConfigOuterClass";
option java_package = "com.google.goonami.callbackserver.proto";

message CallbackserverToolConfig {
  // The configuration for the recording server. This is the server used to
  // record interactions within detectors.
  RecordConfig record_config = 1;

  // The configuration for the polling server. It is used to verify that a
  // vulnerability triggered.
  PollConfig poll_config = 2;

  // Time before cleaning a given interaction in seconds.
  uint32 interaction_ttl_seconds = 3;

  // The interval at which to run cleanup of expired interactions.
  uint32 cleanup_interval_seconds = 4;
}

message RecordConfig {
  // The address to listen for incoming connections.
  string address = 1;

  // The port to listen for incoming connections.
  uint32 port = 2;
}

message PollConfig {
  // The address to listen for incoming connections.
  string address = 1;

  // The port to listen for incoming connections.
  uint32 port = 2;
}
