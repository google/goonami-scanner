syntax = "proto3";

package goonami.proto.configs.detectors;

option go_package = "github.com/google/goonami-scanner/plugins/detectors/sshbruteforce/sshbruteforce_config_go_proto";
option java_multiple_files = true;
option java_outer_classname = "SshBruteForceConfigOuterClass";
option java_package = "com.google.goonami.proto.configs.detectors";

// SshBruteForceConfig contains configuration for the SSH brute force detector.
message SshBruteForceConfig {
  // Maximum number of authentication attempts to make per service.
  // A value of 0 means no limit.
  // Default: 0
  optional int32 max_attempts_per_service = 1;

  // Maximum number of concurrent authentication attempts.
  // A value of 0 falls back to global performance max_concurrency (default: 5).
  // Default: 0
  optional int32 max_concurrency = 2;

  // Rate limit for authentication attempts per second.
  // A value of 0 means no rate limit.
  // Default: 0
  optional int32 max_attempts_per_second = 3;
}
