edition = "2024";

package goonami.proto.configs.bruteforce;

option go_package = "github.com/google/goonami-scanner/common/bruteforce/bruteforce_config_go_proto";
option java_outer_classname = "BruteForceConfigOuterClass";
option java_package = "com.google.goonami.proto.configs.bruteforce";

// BruteForceConfig contains configuration settings for the generic brute-force
// library.
message BruteForceConfig {
  // Maximum number of authentication attempts to make per service.
  int32 max_attempts_per_service = 1 [default = 2000];

  // Maximum number of concurrent authentication attempts per service.
  int32 max_concurrency = 2 [default = 1];

  // Maximum number of authentication attempts per second per service.
  int32 max_requests_per_second = 3 [default = 10];

  // Whether to stop brute-forcing a service as soon as the first valid
  // credential is found.
  bool stop_at_first_valid_credentials = 4 [default = true];
}
