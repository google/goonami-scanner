syntax = "proto3";

package goonami.proto.clients.callbackserver;

option go_package = "github.com/google/goonami-scanner/common/clients/callbackserver/polling_go_proto";

option java_multiple_files = true;
option java_outer_classname = "PollingProtos";
option java_package = "com.google.goonami.proto.clients.callbackserver";

// The polling result message
message PollingResult {
  // Whether or not the scan target has DNS interaction with TCS.
  bool has_dns_interaction = 1;

  // Whether or not the scan target has HTTP interaction with TCS.
  bool has_http_interaction = 2;
}
