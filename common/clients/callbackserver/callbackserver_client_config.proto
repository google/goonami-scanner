syntax = "proto3";

package goonami.proto.configs.clients;

option go_package = "github.com/google/goonami-scanner/common/clients/callbackserver/callbackserver_client_config_go_proto";

option java_multiple_files = true;
option java_outer_classname = "CallbackServerClientConfigOuterClass";
option java_package = "com.google.goonami.proto.configs.clients";

message CallbackServerClientConfig {
  // The address of the callback server (domain or IP).
  optional string callback_address = 1;

  // The port of the callback server.
  optional int32 callback_port = 2;

  // The base URL for polling interaction results.
  optional string polling_base_url = 3;
}
