edition = "2024";

package goonami.proto.configs.clients;

option go_package = "github.com/google/goonami-scanner/common/clients/mysqlclient/mysql_client_config_go_proto";
option java_outer_classname = "MySQLClientConfigOuterClass";
option java_package = "com.google.goonami.proto.configs.clients";

// MySQLClientConfig contains configuration settings for the MySQL client.
message MySQLClientConfig {
  // Maximum time in seconds a MySQL connection/authentication attempt is
  // allowed to run.
  int32 timeout_seconds = 1 [default = 5];
}
