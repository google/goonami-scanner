edition = "2024";

package goonami.proto.configs.clients;

option go_package = "github.com/google/goonami-scanner/common/clients/llm/llm_client_config_go_proto";

option java_outer_classname = "LlmClientConfigOuterClass";
option java_package = "com.google.goonami.proto.configs.clients";

message LlmClientConfig {
  // Timeout for each request to the LLM.
  int32 timeout_per_request_seconds = 1 [default = 240];

  // Maximum number of attempts to run the agent.
  int32 max_attempts = 2 [default = 3];

  // Delay between retries.
  int32 retry_delay_seconds = 3 [default = 10];

  // Configuration for the tools that the LLM agent can use.
  ToolConfig tools = 4;

  // Abstraction for a lite model.
  string lite_model = 5 [default = "gemini-3.5-flash-lite"];

  // Abstraction for a fast model.
  string fast_model = 6 [default = "gemini-3.6-flash"];

  // Abstraction for a pro model.
  string pro_model = 7 [default = "gemini-3.1-pro-preview"];

  // Whether to dump the agent's session trajectories to the artifacts directory.
  bool dump_trajectories = 8 [default = false];
}

message ToolConfig {
  HttpClientConfig http_client_config = 1;
}

// Configuration for the HTTP client tool. Note that the tool uses the core
// HTTP client, and thus these options do not need to be duplicated.
message HttpClientConfig {
  // List of HTTP methods that the agent is allowed to use.
  // Default: ["GET", "POST"]
  repeated string allowed_methods = 1;

  // Maximum number of HTTP requests per network service that the agent is
  // allowed to make.
  int32 max_requests_per_service = 2 [default = 50];

  // Maximum size of an HTTP response body to pass to the agent.
  int32 max_answer_size_bytes = 3 [default = 1048576];

  // Forbidden paths regexps. If the agent tries to request a path that matches
  // any of these regexps, the request will be rejected.
  // Default: [".*abort.*", ".*delete.*", ".*drop.*", ".*huphuphup.*",
  // ".*kill.*", ".*quit.*", ".*remove.*"]
  repeated string forbidden_paths = 4;
}
