syntax = "proto3";

package goonami.proto.configs.clients;

option go_package = "github.com/google/goonami-scanner/common/clients/llm/llm_client_config_go_proto";
option java_multiple_files = true;
option java_outer_classname = "LlmClientConfigOuterClass";
option java_package = "com.google.goonami.proto.configs.clients";

message LlmClientConfig {
  // Timeout for each request to the LLM.
  int32 timeout_per_request_sec = 1;

  // Maximum number of attempts to run the agent.
  int32 max_attempts = 2;

  // Delay between retries.
  int32 retry_delay_sec = 3;
}
